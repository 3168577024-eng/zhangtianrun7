<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="actBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="0.45" stop-color="#a9d8f5"/>
      <stop offset="1" stop-color="#ffd0e0"/>
    </linearGradient>
    <radialGradient id="actGlow" cx="0.72" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#actBg)"/>
  <rect width="960" height="540" fill="url(#actGlow)"/>

  <!-- 远景光斑 -->
  <circle cx="180" cy="120" r="150" fill="#ffffff" opacity="0.22"/>
  <circle cx="820" cy="430" r="190" fill="#ff9ec4" opacity="0.28"/>
  <circle cx="640" cy="90" r="90" fill="#ffffff" opacity="0.25"/>

  <!-- 舞台台阶 -->
  <path d="M0 430h960v110H0z" fill="#ffffff" opacity="0.18"/>
  <path d="M120 470h720v70H120z" fill="#5f8fd0" opacity="0.18"/>

  <!-- 樱花花瓣 -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="240" cy="270" rx="10" ry="6" transform="rotate(-24 240 270)"/>
    <ellipse cx="300" cy="190" rx="8" ry="5" transform="rotate(18 300 190)"/>
    <ellipse cx="700" cy="220" rx="9" ry="5" transform="rotate(-32 700 220)"/>
    <ellipse cx="760" cy="330" rx="11" ry="6" transform="rotate(12 760 330)"/>
    <ellipse cx="520" cy="150" rx="7" ry="4" transform="rotate(28 520 150)"/>
    <ellipse cx="440" cy="380" rx="10" ry="6" transform="rotate(-8 440 380)"/>
    <ellipse cx="860" cy="180" rx="8" ry="5" transform="rotate(40 860 180)"/>
    <ellipse cx="150" cy="380" rx="9" ry="5" transform="rotate(22 150 380)"/>
  </g>

  <!-- 星星点缀 -->
  <g fill="#fff6b0">
    <path d="M600 300l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" opacity="0.9"/>
    <path d="M380 210l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity="0.8"/>
    <path d="M840 380l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity="0.75"/>
  </g>

  <!-- 舞台灯光柱 -->
  <g opacity="0.35">
    <path d="M300 0l90 430h-150z" fill="#ffffff" opacity="0.35"/>
    <path d="M660 0l-90 430h150z" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
