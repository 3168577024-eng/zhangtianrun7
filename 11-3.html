<!DOCTYPE html>
<!-- 姓名：张天润，日期：功能名称 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画长廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .ztr_subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .ztr_corridor {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 20px 10px 40px;
            scroll-snap-type: x mandatory;
        }

        .ztr_corridor::-webkit-scrollbar {
            height: 8px;
        }

        .ztr_corridor::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 4px;
        }

        .ztr_corridor::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .ztr_card {
            min-width: 260px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            scroll-snap-align: start;
            border: 1px solid #2a2a4a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .ztr_card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .ztr_card h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .ztr_demo-area {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f23;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .ztr_desc {
            color: #888;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .ztr_bounce-ball {
            width: 30px;
            height: 30px;
            background: #e91e63;
            border-radius: 50%;
            animation: zhang_bounce 1s ease-in-out infinite;
        }

        @keyframes zhang_bounce {
            0%, 100% { transform: translateY(-30px); }
            50% { transform: translateY(30px); }
        }

        .ztr_pulse-ring {
            width: 40px;
            height: 40px;
            border: 3px solid #4caf50;
            border-radius: 50%;
            animation: zhang_pulse 1.5s ease-out infinite;
        }

        @keyframes zhang_pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .ztr_rotate-square {
            width: 40px;
            height: 40px;
            background: #2196f3;
            animation: zhang_rotate 2s linear infinite;
        }

        @keyframes zhang_rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .ztr_fade-box {
            width: 60px;
            height: 60px;
            background: #ff9800;
            border-radius: 8px;
            animation: zhang_fade 2s ease-in-out infinite;
        }

        @keyframes zhang_fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .ztr_scale-box {
            width: 50px;
            height: 50px;
            background: #9c27b0;
            border-radius: 8px;
            animation: zhang_scale 1.5s ease-in-out infinite;
        }

        @keyframes zhang_scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .ztr_skew-box {
            width: 50px;
            height: 50px;
            background: #00bcd4;
            animation: zhang_skew 2s ease-in-out infinite;
        }

        @keyframes zhang_skew {
            0%, 100% { transform: skewX(0deg); }
            25% { transform: skewX(20deg); }
            75% { transform: skewX(-20deg); }
        }

        .ztr_translate-box {
            width: 40px;
            height: 40px;
            background: #ff5722;
            border-radius: 50%;
            animation: zhang_translate 2s ease-in-out infinite;
        }

        @keyframes zhang_translate {
            0%, 100% { transform: translateX(-40px); }
            50% { transform: translateX(40px); }
        }

        .ztr_color-box {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            animation: zhang_color 3s linear infinite;
        }

        @keyframes zhang_color {
            0% { background: #e91e63; }
            25% { background: #2196f3; }
            50% { background: #4caf50; }
            75% { background: #ff9800; }
            100% { background: #e91e63; }
        }

        .ztr_border-box {
            width: 50px;
            height: 50px;
            border: 3px solid #ffc107;
            animation: zhang_border 2s ease-in-out infinite;
        }

        @keyframes zhang_border {
            0%, 100% { border-radius: 0; border-width: 3px; }
            50% { border-radius: 50%; border-width: 6px; }
        }

        .ztr_shadow-box {
            width: 50px;
            height: 50px;
            background: #673ab7;
            border-radius: 8px;
            animation: zhang_shadow 2s ease-in-out infinite;
        }

        @keyframes zhang_shadow {
            0%, 100% { box-shadow: 0 0 0 rgba(103, 58, 183, 0.5); }
            50% { box-shadow: 0 0 30px rgba(103, 58, 183, 0.8); }
        }

        .ztr_back-home {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px 24px;
            background: #2196f3;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .ztr_back-home:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>
    <h1>动画长廊</h1>
    <p class="ztr_subtitle">左右滑动查看各种 CSS3 动画效果</p>

    <div class="ztr_corridor">
        <div class="ztr_card">
            <h3>弹跳动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_bounce-ball"></div>
            </div>
            <p class="ztr_desc">上下弹跳效果</p>
        </div>

        <div class="ztr_card">
            <h3>脉冲扩散</h3>
            <div class="ztr_demo-area">
                <div class="ztr_pulse-ring"></div>
            </div>
            <p class="ztr_desc">圆环扩散消失</p>
        </div>

        <div class="ztr_card">
            <h3>旋转动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_rotate-square"></div>
            </div>
            <p class="ztr_desc">持续顺时针旋转</p>
        </div>

        <div class="ztr_card">
            <h3>淡入淡出</h3>
            <div class="ztr_demo-area">
                <div class="ztr_fade-box"></div>
            </div>
            <p class="ztr_desc">透明度渐变循环</p>
        </div>

        <div class="ztr_card">
            <h3>缩放动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_scale-box"></div>
            </div>
            <p class="ztr_desc">大小缩放循环</p>
        </div>

        <div class="ztr_card">
            <h3>倾斜动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_skew-box"></div>
            </div>
            <p class="ztr_desc">左右倾斜变换</p>
        </div>

        <div class="ztr_card">
            <h3>平移动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_translate-box"></div>
            </div>
            <p class="ztr_desc">左右平移运动</p>
        </div>

        <div class="ztr_card">
            <h3>颜色变换</h3>
            <div class="ztr_demo-area">
                <div class="ztr_color-box"></div>
            </div>
            <p class="ztr_desc">背景色循环变化</p>
        </div>

        <div class="ztr_card">
            <h3>边框动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_border-box"></div>
            </div>
            <p class="ztr_desc">形状与边框变化</p>
        </div>

        <div class="ztr_card">
            <h3>阴影动画</h3>
            <div class="ztr_demo-area">
                <div class="ztr_shadow-box"></div>
            </div>
            <p class="ztr_desc">发光阴影效果</p>
        </div>
    </div>

    <a href="index.html" class="ztr_back-home">返回首页</a>
</body>
</html>
