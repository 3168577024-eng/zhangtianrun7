<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张天润403</title>
    <style>
       *{
        margin: 0;
        padding: 0;
       }
       body{
        padding: 20px;
       }
       h2{
        margin-bottom: 20px;
       }
       .flex{
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
       }
       .flex li{ 
        width: 20%;
        height: 200px;
        border: 1px solid #333;
        list-style: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
       }
       .line{
        display: flex;
        justify-content: center;
        gap: 10px;
       }
       .box{
        width: 70px;
        height: 70px;
        background-color: #f2f3f4;
        border: 1px solid #999;
        box-sizing: border-box;
       }
    </style>
</head>
<body>
    <h2>张天润的flex</h2>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <li>
            <div class="line">
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="line">
                <div class="box"></div>
            </div>
        </li>
        <li>
            <div class="line">
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="line">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </li>
    </ul>
</body>
</html>
