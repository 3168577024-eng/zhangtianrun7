<!DOCTYPE html>
<!-- 姓名：张天润，日期：功能名称 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一左一右</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .ztr_title{
            width: 500px;
            height: 33px;
            line-height: 33px;
            padding-left: 10px;
            padding-right: 16px;
            margin: 50px;
        }
        .ztr_title h2{
            font-size: 14px;
            color: #039

        }
        .ztr_title a{
            font-size: 12px;
            color: #999;
            text-decoration: none;

        }
        .ztr_title:first-child{
            border:1px solid #ccc;
            display: flex;
            justify-content: space-between;
        }
        .ztr_title:nth-child(2){
            display: flex;
            border-top:2px solid #ccc;
        }
        .ztr_title:nth-child(2) h2{
            flex-grow: 1;
            /* 占剩余的所有空间 */
        }
        .ztr_title:nth-child(3){
            position: relative;
            border-bottom: 3px solid #039;
        }
        .ztr_title:nth-child(3) a{
            position: absolute;
            right: 16px;
            top: 0;
            
        }

    </style>
</head>
<body>
    <div class="ztr_title">
        <h2>张天润的标题</h2>
        <a href="#">更多</a>
    </div>
 

     <div class="ztr_title">
        <h2>张天润的标题</h2>
        <a href="#">更多</a>
    </div>


     <div class="ztr_title">
        <h2>张天润的标题</h2>
        <a href="#">更多</a>
    </div>


</body>
</html>
