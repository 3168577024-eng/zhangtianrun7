<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张天润的幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #e9eef5;
            font-family: Arial, sans-serif;
        }

        .slideshow {
            width: min(900px, 90vw);
            text-align: center;
        }

        .slideshow h1 {
            margin: 0 0 20px;
            color: #263238;
            font-size: clamp(1.5rem, 4vw, 2.4rem);
        }

        .carousel {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(20, 35, 50, 0.25);
            background: #d5dbe2;
        }

        .slide {
            position: absolute;
            inset: 0;
            visibility: hidden;
            transform: translateX(100%);
            animation: slide-position 9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            will-change: transform, visibility;
        }

        .slide img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .slide:nth-child(1) {
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            animation-delay: 3s;
        }

        .slide:nth-child(3) {
            animation-delay: 6s;
        }

        .caption {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            padding: 14px 24px;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            font-size: clamp(1.1rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @keyframes slide-position {
            0%, 22% {
                visibility: visible;
                transform: translateX(0);
            }
            28%, 50% {
                visibility: visible;
                transform: translateX(-100%);
            }
            51%, 100% {
                visibility: hidden;
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>
    <main class="slideshow">
        <h1>张天润</h1>
        <section class="carousel" aria-label="张天润的图片幻灯片">
            <figure class="slide">
                <img src="img/2cc9882926fcbce73806e15bcf14a8ef.jpg" alt="幻灯片图片一">
            </figure>
            <figure class="slide">
                <img src="img/6311d91963929c2e1578620659212d57.jpg" alt="幻灯片图片二">
            </figure>
            <figure class="slide">
                <img src="img/685f0a52b56d40ed8fed72c50a6bc473.jpg" alt="幻灯片图片三">
            </figure>
            <div class="caption">张天润</div>
        </section>
    </main>
</body>
</html>
