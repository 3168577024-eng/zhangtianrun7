<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            /* 水平垂直居中 */
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.6s;
            box-sizing: border-box;
            /* width:包含padding和border */
        }
        .box:first-child:hover{
            background-color: red;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
           border-radius:50%;
           border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px  #ccc;
        }
        .box:nth-child(4):hover{
            text-shadow: 100px 10px 10px  #ccc;
        }
        .box:nth-child(5):hover{
            /* 线性渐变 */
            background: linear-gradient(to right, red, yellow);
        }
        .box:nth-of-type(5)+.box{
            /* 径向渐变 */
            background: radial-gradient(circle, red, yellow);
        }
        .box:nth-of-type(7):hover{
            /* 背景图片 */
            transform: scale(1.5);
        }
        .box:nth-child(8):hover{
            transform:translate(-150px)
        }
        .box:nth-child(9):hover{
            transform:rotateX(-180deg)
        }
        .box:nth-child(10):hover{
            transform: skewX(20deg) translateY(50px);
        }
        .box:nth-last-child(2):hover:before{
            /* 内部的最前面的元素 */
            content: "*";
            color: red;
        }
        /* 扩展1，第12个盒子，鼠标上面 显示自己的名字，要求名字深色背景白色文字，水平垂直居中 */
        .box:nth-child(12){
            position: relative;
            overflow: hidden;
        }
        .box:nth-child(12)::before{
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(30, 30, 30, 0.95);
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .box:nth-child(12)::after{
            content: "张天润";
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
            font-weight: normal;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        .box:nth-child(12):hover::before,
        .box:nth-child(12):hover::after{
            opacity: 1;
        }
        .box:nth-child(3n):hover{
            border:3px solid red;
        }
        /* 偶数：even，奇数：odd */
        /* 扩展2：鼠标在偶数个盒子上时，自定义效果 */
        .box:nth-child(even):hover{
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
            border-color: #ff5a5f;
            box-shadow: 0 0 20px rgba(255, 90, 95, 0.5);
            transform: rotate(-8deg) scale(1.08);
            color: #5b2c6f;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
